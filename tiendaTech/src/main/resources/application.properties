
spring.application.name=tienda
server.port=80

# Se define el formato de fecha/hora del log del servidor web
logging.pattern.dateformat=HH:mm:ss

# Se define no presentar el banner de SPRING en el log del servidor
spring.main.banner-mode=off

# Se evita el uso de cache en desarrollo
spring.thymeleaf.cache=false

# Conexion local a la BD Techshop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techshop

# Conexion NUBE AIVEN a la BD Techshop en MySQL
#spring.datasource.url=jdbc:mysql://SERVIDOR_AIVEN:PUERTO/techshop

# Usuario y clave de MySQL local
spring.datasource.username=root
spring.datasource.password=Cdttm01*

# Driver y plataforma de comunicacion
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Mostrar informacion en el log para desarrollo
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
